[package]
name = "mime-meta-language"
description = "CLI and lib for the Emacs MIME message Meta Language (MML)"
version = "1.1.1"
authors = ["soywod <pimalaya.org@posteo.net>"]
rust-version = "1.88"
edition = "2024"
license = "MIT OR Apache-2.0"
categories = ["command-line-utilities", "email", "text-processing"]
keywords = ["email", "mime", "message", "mml", "emacs"]
homepage = "https://pimalaya.org"
documentation = "https://docs.rs/mime-meta-language/latest/mml"
repository = "https://github.com/pimalaya/mml"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["compiler", "interpreter"]
cli = ["dep:anyhow", "dep:ariadne", "dep:clap", "dep:edit", "dep:pimalaya-cli", "dep:pimalaya-config", "dep:serde", "dep:serde_json"]
compiler = ["dep:chumsky", "dep:shellexpand", "dep:tree_magic_mini"]
interpreter = ["dep:nanohtml2text"]
pgp-gpg = ["dep:gpgme"]

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"

[[bin]]
name = "mml"
path = "src/main.rs"
required-features = ["cli"]

[lib]
name = "mml"
path = "src/lib.rs"

[build-dependencies]
pimalaya-cli = { version = "0.2", default-features = false, features = ["build"], optional = true }

[dev-dependencies]
concat-with = { version = "0.2", default-features = false }
tempfile = { version = "3", default-features = false, features = ["getrandom"] }

[dependencies]
anyhow = { version = "1", default-features = false, features = ["std"], optional = true }
ariadne = { version = "0.6", default-features = false, optional = true }
chumsky = { version = "0.13", default-features = false, features = ["std", "stacker"], optional = true }
clap = { version = "4.4", default-features = false, features = ["color", "derive", "env", "error-context", "help", "std", "suggestions", "usage", "wrap_help"], optional = true }
edit = { version = "0.1", default-features = false, features = ["better-path"], optional = true }
gpgme = { version = "0.11", default-features = false, optional = true }
log = { version = "0.4", default-features = false }
mail-builder = { version = "0.4", default-features = false, features = ["gethostname"] }
mail-parser = { version = "0.11", default-features = false }
nanohtml2text = { version = "0.2", default-features = false, optional = true }
once_cell = { version = "1.21", default-features = false, features = ["std"] }
ouroboros = { version = "0.18", default-features = false }
pimalaya-cli = { version = "0.2", default-features = false, features = ["prompt", "terminal"], optional = true }
pimalaya-config = { version = "0.1", default-features = false, features = ["toml"], optional = true }
regex = { version = "1.12", default-features = false, features = ["perf", "std", "unicode"] }
serde = { version = "1", default-features = false, features = ["derive", "std"], optional = true }
serde_json = { version = "1", default-features = false, features = ["std"], optional = true }
shellexpand = { version = "3.1", default-features = false, features = ["base-0", "tilde"], optional = true }
thiserror = { version = "2", default-features = false, features = ["std"] }
tree_magic_mini = { version = "3", default-features = false, optional = true }
