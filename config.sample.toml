[accounts.example]
default = true				# make this account the default one used
from = "test@example.org"		# the From address of the drafts
from-name = "Test"			# the display name paired with it
signature = "Test\nhttps://example.org"	# the signature, after its delimiter
#signature-delim = "-- \n"		# the delimiter before the signature

compose.signature-style = "inlined"	# append the signature to the body
#compose.signature-style = "attached"	# attach it as signature.txt
#compose.signature-style = "hidden"	# leave it out
compose.format = "fixed"		# send plain text lines as written
#compose.format = "flowed"		# break long lines softly, the reader joining them back (RFC 3676)
#compose.flowed-column = 72		# the column flowed lines break at, 998 shipping paragraphs whole

reply.posting-style = "top"		# your reply, then the quote
#reply.posting-style = "bottom"		# the quote, then your reply
#reply.posting-style = "interleaved"	# the cursor at the top of the quote
reply.signature-style = "below-quote"	# the signature after the quote
#reply.signature-style = "above-quote"	# the signature between your reply and the quote
#reply.signature-style = "attached"	# attach it as signature.txt
#reply.signature-style = "hidden"	# leave it out
#reply.quote-headline = "You wrote:\n"	# the line above the quote, empty by default
reply.format = "fixed"			# send plain text lines as written
#reply.format = "flowed"		# break long lines softly (RFC 3676)
#reply.flowed-column = 72		# the column flowed lines break at

forward.posting-style = "top"				# the forwarded message quoted below your body
#forward.posting-style = "attached"			# the forwarded message attached as message/rfc822
forward.signature-style = "inlined"			# append the signature to the body
#forward.signature-style = "attached"			# attach it as signature.txt
#forward.signature-style = "hidden"			# leave it out
#forward.quote-headline = "Forwarded message:\n"	# the line above the forwarded message, empty by default
forward.format = "fixed"				# send plain text lines as written
#forward.format = "flowed"				# break long lines softly (RFC 3676)
#forward.flowed-column = 72				# the column flowed lines break at

#read.include-headers = ["From", "To", "Cc", "Subject", "Date"]	# the headers to keep, all others dropped
#read.exclude-headers = ["Received", "DKIM-Signature"]		# the headers to drop, ignored beside include-headers
#read.include-parts = ["text/plain"]				# the part types to render, all others dropped
#read.exclude-parts = ["text/html"]				# the part types to skip, ignored beside include-parts
#read.show-multiparts = true					# render the multipart markers
#read.save-attachments = true					# save the attachments while rendering
#read.save-attachments-dir = "/home/user/Downloads"		# where they land, the system temporary directory by default
#read.hide-attachments = true					# leave the attachment markers out
#read.hide-inline-attachments = true				# leave the inline attachment markers out
#read.hide-plain-texts-signature = true				# strip the signature from plain text parts
